syntax = "proto3";

package sentinel;

// Service used by cache servers to register themselves with the sentinel.
service SentinelService {
  rpc RegisterCacheServer(CacheServerRegistrationRequest) returns (CacheServerRegistrationResponse);
  rpc GetPrimaryForCluster(PrimaryForClusterRequest) returns (PrimaryForClusterResponse);
}

message PrimaryForClusterRequest {
  int32 cluster_id = 1;
}

message PrimaryForClusterResponse {
  bool found = 1;
  int32 server_id = 2;
  int32 port = 3;
}

message CacheServerRegistrationRequest {
  int32 server_id = 1;
  int32 port = 2;
  int32 cluster_id = 3;
}

message CacheServerRegistrationResponse {
  bool success = 1;
  bool is_primary = 2;
  int32 primary_port = 3;
}
